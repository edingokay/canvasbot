name: Canvas Telegram Bot

on:
  schedule:
    - cron: '21 */3 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub'ın txt dosyasını depoya kaydetmesi için gereken izin
    steps:
      - name: Kodları Depodan Çek
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          pip install canvasapi requests

      - name: Botu Çalıştır
        env:
          CANVAS_API_KEY: ${{ secrets.CANVAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python CanvasAP.py

      - name: Gönderilen Duyuruları Hafızaya Kaydet
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add gonderilen_duyurular.txt
          git commit -m "Hafıza güncellendi" || echo "Yeni duyuru yok"
          git push
